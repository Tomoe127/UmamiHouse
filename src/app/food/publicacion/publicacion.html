<section class="w-full px-6 md:px-12 lg:px-20 py-16 bg-gray-50">

  <div class="text-center mb-12">
    <h2 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4">Últimas Noticias y Eventos</h2>
    <div class="mx-auto" style="width: 120px; border-bottom: 3px solid #333;"></div>
  </div>

  <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

    @for (post of blogPosts(); track post.title) {
    <article class="bg-white rounded-xl overflow-hidden shadow-lg hover:shadow-2xl transition-all duration-300 group">

      <div class="relative overflow-hidden h-64">
        <img [src]="post.image" [alt]="post.title"
          class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500">
        <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm px-4 py-2 rounded-full">
          <span class="text-xs font-semibold text-gray-900 uppercase tracking-wider">{{ post.category }}</span>
        </div>
      </div>

      <div class="p-6">
        <h3 class="text-xl font-bold text-gray-900 mb-3 group-hover:text-gray-600 transition-colors line-clamp-2">
          {{ post.title }}
        </h3>

        <div class="flex items-center gap-2 text-sm text-gray-500 mb-4">
          <span class="font-medium">{{ post.author }}</span>
          <span>•</span>
          <span>{{ post.date }}</span>
        </div>

        <p class="text-gray-600 leading-relaxed mb-6 line-clamp-3">
          {{ post.description }}
        </p>
        <a [href]="post.link"
          class="inline-flex items-center gap-2 text-gray-900 font-semibold hover:gap-4 transition-all group/link">
          Leer Más
          <svg class="w-4 h-4 transform group-hover/link:translate-x-1 transition-transform" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
          </svg>
        </a>
      </div>
    </article>
    }
  </div>
</section>
