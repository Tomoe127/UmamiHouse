<section id="menu" class="w-full px-6 md:px-12 lg:px-20 py-16 bg-white">
  <h3 class="text-lg font-semibold text-gray-600 uppercase tracking-wider text-center mb-4 mt-4">
    Elige uno de nuestros platos
  </h3>

  <h1 class="text-4xl md:text-5xl font-bold text-gray-900 text-center mb-4">
    Sabores que cuentan una historia
  </h1>
  <div class="mx-auto mb-7 mt-7" style="width: 120px; border-bottom: 3px solid #333;"></div>
  <div class="max-w-7xl mx-auto space-y-8 mb-15">

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 justify-items-center">
      @for (flavor of firstRow; track flavor.title) {
      <div class="flex flex-col items-center text-center bg-white" style="width: 275px;">
        <div class="">
          <img [src]="flavor.image" [alt]="flavor.title" style="width: 250px; height: 266px; object-fit: contain;"
            loading="lazy">
        </div>
        <div class="px-4">
          <h4 class="text-xl font-bold text-gray-900 mb-3 uppercase">
            {{ flavor.title }}
          </h4>

          <p class="text-gray-600 text-sm leading-relaxed">
            {{ flavor.description }}
          </p>
        </div>
      </div>
      }
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 justify-items-center">
      @for (flavor of secondRow; track flavor.title) {
      <div class="flex flex-col items-center text-center bg-white" style="width: 275px;">
        <div class="">
          <img [src]="flavor.image" [alt]="flavor.title" style="width: 250px; height: 266px; object-fit: contain;"
            loading="lazy">
        </div>

        <div class="px-4">
          <h4 class="text-xl font-bold text-gray-900 mb-3 uppercase">
            {{ flavor.title }}
          </h4>

          <p class="text-gray-600 text-sm leading-relaxed">
            {{ flavor.description }}
          </p>
        </div>
      </div>
      }
    </div>

  </div>
</section>
