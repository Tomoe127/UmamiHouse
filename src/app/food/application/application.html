<section id="cocina" class="relative w-full px-6 md:px-12 lg:px-20 py-30 bg-cover bg-center bg-fixed"
  style="background-image: url('https://images.unsplash.com/photo-1514933651103-005eec06c04b?w=1920');">

  <div class="absolute inset-0 bg-black/80"></div>
  <div class="relative z-10 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">

    <div>
      <h3 class="text-lg font-semibold text-gray-300 uppercase tracking-wider mb-4">Nuestra Cocina</h3>
      <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold text-white leading-tight mb-4 uppercase">
        El arte detrás de cada plato.
      </h2>

      <div class="mb-8" style="width: 120px; border-bottom: 3px solid #fff;"></div>

      <p class="text-lg text-gray-200 leading-relaxed mb-8 max-w-xl">
        En nuestra cocina abierta, los chefs combinan técnicas tradicionales japonesas con ingredientes frescos
        de temporada. Mira de cerca cómo preparamos cada receta con dedicación y respeto por la tradición
        culinaria.
      </p>

      <button
        class="px-8 py-3 bg-white text-gray-900 font-semibold rounded-lg hover:bg-gray-200 transition-all shadow-lg">
        Ver Más
      </button>
    </div>

    <div class="relative">
      <div class="relative rounded-lg overflow-hidden shadow-2xl cursor-pointer group aspect-video"
        (click)="openVideoModal()">
        <img [src]="'https://img.youtube.com/vi/' + youtubeVideoId + '/maxresdefault.jpg'" alt="Video thumbnail"
          class="w-full h-full object-cover transition-transform duration-300 group-hover:opacity-80">

        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
          <svg class="w-20 h-20 text-white drop-shadow-2xl" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z" />
          </svg>
        </div>
      </div>
    </div>

  </div>
</section>

@if (showVideoModal()) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-90 px-4"
  (click)="closeVideoModal()">
  <div class="relative w-full max-w-5xl" (click)="$event.stopPropagation()">

    <button (click)="closeVideoModal()"
      class="absolute -top-12 right-0 text-white text-4xl hover:text-gray-300 transition">
      ×
    </button>

    <div class="relative pt-[56.25%]">
      <iframe class="absolute inset-0 w-full h-full rounded-lg" [src]="videoUrl()" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </div>
</div>
}

<app-carousel />
